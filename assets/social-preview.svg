<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1110" cy="84" r="180" fill="#2563eb" opacity="0.14"/>
  <circle cx="1180" cy="560" r="240" fill="#0ea5e9" opacity="0.10"/>
  <text x="72" y="92" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" letter-spacing="2">ENGINEERING MEMLOG</text>
  <text x="72" y="190" fill="#f8fafc" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="760">Stop debugging the same bug twice.</text>
  <text x="72" y="250" fill="#cbd5e1" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29">Recall verified fixes at the moment a failure appears.</text>
  <g transform="translate(72 325)" filter="url(#shadow)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" font-weight="650">
    <rect x="0" y="0" width="224" height="82" rx="14" fill="#172033" stroke="#475569"/>
    <text x="112" y="50" text-anchor="middle" fill="#f8fafc">Reproduce</text>
    <text x="266" y="52" text-anchor="middle" fill="#38bdf8" font-size="36">→</text>
    <rect x="306" y="0" width="224" height="82" rx="14" fill="#172033" stroke="#38bdf8" stroke-width="2"/>
    <text x="418" y="50" text-anchor="middle" fill="#7dd3fc">Recall</text>
    <text x="572" y="52" text-anchor="middle" fill="#38bdf8" font-size="36">→</text>
    <rect x="612" y="0" width="224" height="82" rx="14" fill="#172033" stroke="#fbbf24" stroke-width="2"/>
    <text x="724" y="50" text-anchor="middle" fill="#fde68a">Verify</text>
    <text x="878" y="52" text-anchor="middle" fill="#38bdf8" font-size="36">→</text>
    <rect x="918" y="0" width="224" height="82" rx="14" fill="#172033" stroke="#4ade80" stroke-width="2"/>
    <text x="1030" y="50" text-anchor="middle" fill="#86efac">Remember</text>
  </g>
  <text x="72" y="548" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23">Claude Code plugin  ·  local-first  ·  provider-ready</text>
  <text x="1208" y="592" text-anchor="end" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">github.com/atazifor/engineering-memlog</text>
</svg>
